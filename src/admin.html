<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script type="module">
import {db,fapp,$,esc,today,hm,myIP,upload,css,checkUpdate,collection,doc,getDoc,getDocs,setDoc,deleteDoc,addDoc,query,where,orderBy} from './common.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
css();
const auth=getAuth(fapp),app=$('#app');let cur='scan',sc=null;
const stopScan=()=>{if(sc){sc.stop().catch(()=>{});sc=null}};
const ids=async c=>(await getDocs(collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const tabs={scan,students,batches,attend,notice};

onAuthStateChanged(auth,u=>{
  if(!u){app.innerHTML=`<div class="card"><h2>Admin Login</h2><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><button id="go">Login</button><p id="m" class="m"></p></div>`;
    $('#go').onclick=()=>signInWithEmailAndPassword(auth,$('#e').value.trim(),$('#p').value).catch(()=>$('#m').textContent='❌ Login failed');return}
  app.innerHTML=`<div id="nav"></div><div id="main"></div><button class="sec" id="out">Logout</button>`;
  $('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){stopScan();cur=t;nav();tabs[t]()}};
  $('#out').onclick=()=>{stopScan();signOut(auth)};
  nav();tabs[cur]();
});
function nav(){$('#nav').innerHTML=Object.keys(tabs).map(k=>`<button data-t="${k}" class="${k==cur?'on':''}">${k}</button>`).join('')}

async function mark(t,aip,chk){
  const [id,ts,ip]=t.split('|');
  if(!id||!ts)return '❌ Invalid QR';
  if(Math.abs(Date.now()-+ts)>45000)return '❌ QR expired (screenshot?)';
  const sd=await getDoc(doc(db,'students',id));if(!sd.exists())return '❌ Unknown student';
  const s=sd.data(),b=(await getDoc(doc(db,'batches',s.batch))).data();
  if(!b)return '❌ Batch not found';
  const n=hm();if(n<b.start||n>=b.end)return `❌ ${s.name}: batch ${s.batch} time ${b.start}-${b.end}`;
  if(chk&&(!ip||ip!==aip))return `❌ ${s.name}: not on classroom Wi-Fi`;
  const ref=doc(db,'attendance',today()+'_'+id);
  if((await getDoc(ref)).exists())return `ℹ️ ${s.name} already present`;
  await setDoc(ref,{id,name:s.name,batch:s.batch,date:today(),time:n,method:'qr'});
  return `✅ ${s.name} present`;
}
async function scan(){
  const st=(await getDoc(doc(db,'settings','main'))).data()||{};
  $('#main').innerHTML=`<label><input type="checkbox" id="ipc" style="width:auto" ${st.ipcheck!==false?'checked':''}> Wi-Fi (IP) check</label><div id="reader"></div><h3 id="msg" class="m">Scan student QR</h3>`;
  $('#ipc').onchange=e=>setDoc(doc(db,'settings','main'),{ipcheck:e.target.checked});
  const aip=await myIP();let busy=false;
  sc=new Html5Qrcode('reader');
  sc.start({facingMode:'environment'},{fps:10,qrbox:240},async t=>{
    if(busy)return;busy=true;
    try{$('#msg').textContent=await mark(t,aip,$('#ipc').checked)}catch{$('#msg').textContent='❌ Error'}
    setTimeout(()=>busy=false,2500);
  }).catch(e=>$('#msg').textContent='Camera: '+e);
}
async function students(){
  const bs=await ids('batches'),ss=await ids('students');
  $('#main').innerHTML=`<div class="card"><input id="i" placeholder="Student ID"><input id="n" placeholder="Name"><input id="p" type="tel" placeholder="Mobile"><select id="b">${bs.map(b=>`<option>${esc(b.id)}</option>`).join('')}</select><input id="f" type="file" accept="image/*"><button id="add">Add / Update</button><p id="m" class="m"></p></div>`+
    ss.map(s=>`<div class="row">${s.photo?`<img src="${esc(s.photo)}">`:''}<span>${esc(s.id)} · ${esc(s.name)} · ${esc(s.batch)}</span><button data-d="${esc(s.id)}">✕</button></div>`).join('');
  $('#add').onclick=async()=>{
    const id=$('#i').value.trim().replace(/\//g,''),n=$('#n').value.trim(),p=$('#p').value.trim(),b=$('#b').value;
    if(!id||!n||!p||!b)return $('#m').textContent='সব ঘর পূরণ করুন (আগে Batch বানান)';
    try{$('#m').textContent='Saving...';const f=$('#f').files[0],d={name:n,phone:p,batch:b};
      if(f)d.photo=await upload(f);
      await setDoc(doc(db,'students',id),d,{merge:true});students();
    }catch(e){$('#m').textContent='❌ '+e.message}
  };
  $('#main').onclick=async e=>{const d=e.target.dataset.d;if(d&&confirm('Delete '+d+'?')){await deleteDoc(doc(db,'students',d));students()}};
}
async function batches(){
  const bs=await ids('batches');
  $('#main').innerHTML=`<div class="card"><input id="n" placeholder="Batch name"><label>Start <input id="s" type="time" value="09:00"></label><label>End <input id="e" type="time" value="10:00"></label><button id="add">Save Batch</button></div>`+
    bs.map(b=>`<div class="row"><span>${esc(b.id)} · ${esc(b.start)}–${esc(b.end)}</span><button data-d="${esc(b.id)}">✕</button></div>`).join('');
  $('#add').onclick=async()=>{const n=$('#n').value.trim().replace(/\//g,'');if(!n||!$('#s').value||!$('#e').value)return;await setDoc(doc(db,'batches',n),{start:$('#s').value,end:$('#e').value});batches()};
  $('#main').onclick=async e=>{const d=e.target.dataset.d;if(d&&confirm('Delete batch?')){await deleteDoc(doc(db,'batches',d));batches()}};
}
async function attend(d=today(),b=''){
  const bs=await ids('batches');
  if(!bs.length)return $('#main').innerHTML='<p class="m">আগে Batch বানান</p>';
  b=b||bs[0].id;
  const ss=(await getDocs(query(collection(db,'students'),where('batch','==',b)))).docs.map(x=>({id:x.id,...x.data()}));
  const at=new Set((await getDocs(query(collection(db,'attendance'),where('date','==',d)))).docs.map(x=>x.data().id));
  $('#main').innerHTML=`<input id="d" type="date" value="${d}"><select id="b">${bs.map(x=>`<option ${x.id==b?'selected':''}>${esc(x.id)}</option>`).join('')}</select><p class="m">Present ${ss.filter(s=>at.has(s.id)).length}/${ss.length}</p>`+
    ss.map(s=>`<div class="row"><span>${esc(s.id)} · ${esc(s.name)}</span><button class="${at.has(s.id)?'':'sec'}" data-s="${esc(s.id)}">${at.has(s.id)?'Present ✓':'Absent'}</button></div>`).join('');
  $('#d').onchange=$('#b').onchange=()=>attend($('#d').value||today(),$('#b').value);
  $('#main').onclick=async e=>{const id=e.target.dataset.s;if(!id)return;
    const ref=doc(db,'attendance',d+'_'+id);
    if(at.has(id))await deleteDoc(ref);else{const s=ss.find(x=>x.id==id);await setDoc(ref,{id,name:s.name,batch:b,date:d,time:hm(),method:'manual'})}
    attend(d,b)};
}
async function notice(){
  const l=(await getDocs(query(collection(db,'announcements'),orderBy('ts','desc')))).docs.map(x=>({id:x.id,...x.data()}));
  $('#main').innerHTML=`<div class="card"><input id="t" placeholder="Title"><input id="x" placeholder="Message"><button id="add">Send Notification</button></div>`+
    l.map(a=>`<div class="row"><span><b>${esc(a.title)}</b><br>${esc(a.body)}</span><button data-d="${a.id}">✕</button></div>`).join('');
  $('#add').onclick=async()=>{const t=$('#t').value.trim();if(!t)return;await addDoc(collection(db,'announcements'),{title:t,body:$('#x').value.trim(),ts:Date.now()});notice()};
  $('#main').onclick=async e=>{const d=e.target.dataset.d;if(d){await deleteDoc(doc(db,'announcements',d));notice()}};
}
checkUpdate('admin');
</script></body></html>
