name: Build APKs
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [admin, student]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Prepare web
        run: |
          mkdir www
          cp src/${{ matrix.role }}.html www/index.html
          cp src/common.js www/common.js
          sed -i "s#REPO=\"[^\"]*\"#REPO=\"${{ github.repository }}\"#" www/common.js
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then sed -i "s#VERSION=\"[^\"]*\"#VERSION=\"${GITHUB_REF_NAME#v}\"#" www/common.js; fi
      - name: Android project
        run: |
          npx cap init "Attendance ${{ matrix.role }}" com.attendance.${{ matrix.role }} --web-dir www
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $M
          npx cap sync android
      - name: Fixed signing key (needed so updates install over old version)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; else echo "::warning::debug.keystore missing - updates will not install over old APK"; fi
      - name: Build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.role }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.role }}", path: "${{ matrix.role }}.apk" }
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "out/*.apk" }
