name: Build Apps
on:
  push:
    paths: ['project.zip', 'google-services.json', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
env:
  VER: 1.0.${{ github.run_number }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [admin, student]
    steps:
      - uses: actions/checkout@v4
      - name: Extract project.zip
        run: |
          [ -f project.zip ] || { echo "::error::project.zip repo er root e nai"; exit 1; }
          unzip -q project.zip -d proj
          P=$(dirname "$(find proj -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "APP=$GITHUB_WORKSPACE/$P" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ matrix.role }}
      - name: Build APK
        run: |
          cd "$APP"
          npm install --legacy-peer-deps
          mkdir www
          cp src/${{ matrix.role }}.html www/index.html
          cp src/*.js src/*.png www/
          sed -i "s#REPO=\"[^\"]*\"#REPO=\"${{ github.repository }}\"#;s#VERSION=\"[^\"]*\"#VERSION=\"$VER\"#" www/common.js
          npx cap init "${{ matrix.role == 'admin' && 'SCTC Admin' || 'SCTC Student' }}" com.attendance.${{ matrix.role }} --web-dir www
          npx cap add android
          cp -r icons/mipmap-* android/app/src/main/res/
          D=android/app/src/main/java/com/attendance/${{ matrix.role }}
          mkdir -p "$D" android/app/src/main/res/xml
          for f in ApkInstallerPlugin MainActivity; do sed "s/__PKG__/com.attendance.${{ matrix.role }}/g" native/$f.java > "$D/$f.java"; done
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="update" path="update/"/><external-path name="my_images" path="."/><cache-path name="my_cache_images" path="."/></paths>
          XML
          if [ "${{ matrix.role }}" = student ]; then
            G=""; for g in "$GITHUB_WORKSPACE/google-services.json" google-services.json; do [ -f "$g" ] && { G="$g"; break; }; done
            if [ -n "$G" ]; then cp "$G" android/app/google-services.json; echo "Push: google-services.json added"; else echo "::warning::google-services.json nai, tai student app e push notification kaj korbe na (baki sob thik cholbe)"; fi
          fi
          for f in $(find android/app/src/main/res -name splash.png); do case "$f" in *land*) cp icons/splash_land.png "$f";; *) cp icons/splash_port.png "$f";; esac; done
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/><application#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/;s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          cp -r icons/notif/drawable-* android/app/src/main/res/
          sed -i 's#</application>#<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat"/></application>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          [ -f debug.keystore ] || keytool -genkey -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      debuggable false
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          EOF
          cd android
          for u in https://services.gradle.org/distributions/gradle-8.2.1-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip https://mirrors.aliyun.com/gradle/gradle-8.2.1-bin.zip; do
            echo "Downloading $u"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 -o /tmp/gradle.zip "$u" && unzip -tq /tmp/gradle.zip >/dev/null; then break; fi
            rm -f /tmp/gradle.zip
          done
          [ -f /tmp/gradle.zip ] || { echo "::error::Gradle download hoy ni, pore Re-run korun"; exit 1; }
          sed -i 's#^distributionUrl=.*#distributionUrl=file\\:///tmp/gradle.zip#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew assembleRelease && break; echo "Try $i failed"; [ $i = 3 ] && exit 1; sleep 15; done
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/${{ matrix.role }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.role }}
          path: ${{ matrix.role }}.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Version ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          body: ${{ github.event.head_commit.message }}
  pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build web site
        run: |
          unzip -q project.zip -d proj
          P=$(dirname "$(find proj -name package.json -not -path '*/node_modules/*' | head -1)")
          for r in admin student; do
            mkdir -p site/$r
            cp "$P/src/$r.html" site/$r/index.html
            cp "$P"/src/*.js "$P"/src/*.png site/$r/
            cp "$P/src/manifest-$r.json" site/$r/manifest.json
          done
          echo '<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font:20px sans-serif;padding:24px"><p><a href="student/">Student</a></p><p><a href="admin/">Admin</a></p>' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
